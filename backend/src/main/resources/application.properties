spring.application.name=nuanci

# 로컬 개발: bootRun 시 루트 compose.yaml의 Postgres를 띄우고 DB 연결을 자동 설정
# start-only라서 BE를 꺼도 DB는 계속 켜져 있다
spring.docker.compose.file=../compose.yaml
spring.docker.compose.lifecycle-management=start-only

spring.jpa.open-in-view=false

# 관리자 계정. 비밀번호가 비어 있으면 관리자 로그인이 막힌다
nuanci.admin-id=${NUANCI_ADMIN_ID:admin}
nuanci.admin-password=${NUANCI_ADMIN_PASSWORD:}

# 구글 로그인. 구글 클라우드 콘솔의 OAuth 클라이언트 값이며, 비어 있으면 로그인이 꺼진다
nuanci.google-client-id=${GOOGLE_CLIENT_ID:}
nuanci.google-client-secret=${GOOGLE_CLIENT_SECRET:}
nuanci.site-url=${NUANCI_SITE_URL:http://localhost:3000}

# 공개 장면 발행(S3 + CloudFront). 버킷이 비어 있으면 발행 작업을 올리지 않는다
nuanci.content.bucket=${NUANCI_CONTENT_BUCKET:}
nuanci.content.region=${NUANCI_CONTENT_REGION:ap-northeast-2}
nuanci.content.prefix=${NUANCI_CONTENT_PREFIX:dev}
nuanci.content.access-key=${NUANCI_CONTENT_ACCESS_KEY:}
nuanci.content.secret-key=${NUANCI_CONTENT_SECRET_KEY:}
