# 모든 푸시와 PR에서 BE 테스트·FE 검사를 돌리고, main에 푸시되면 BE → FE 순서로 배포한다
name: CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  NUANCI_SERVER: ubuntu@13.124.12.101
  API_URL: https://13-124-12-101.sslip.io
  LIGHTSAIL_INSTANCE: nuanci-backend
  AWS_REGION: ap-northeast-2

jobs:
  backend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      # Testcontainers가 러너의 Docker로 실제 Postgres를 띄운다
      - run: ./gradlew test

  frontend-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # PageProps 같은 라우트 타입은 빌드 때 생기므로 타입 검사 전에 따로 만든다
      - run: npx next typegen
      - run: npx tsc --noEmit
      - run: npm run lint

  deploy-backend:
    needs: [backend-test, frontend-check]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: SSH 키 준비
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
        env:
          SSH_KEY: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.LIGHTSAIL_KNOWN_HOSTS }}
      # 서버 SSH는 평소 닫혀 있고, 배포하는 동안만 이 러너의 IP에 연다
      - name: 러너 IP로 SSH 열기
        id: runner
        run: |
          ip=$(curl -fsS https://checkip.amazonaws.com | tr -d '[:space:]')
          echo "ip=$ip" >> "$GITHUB_OUTPUT"
          aws lightsail open-instance-public-ports --instance-name "$LIGHTSAIL_INSTANCE" \
            --port-info "fromPort=22,toPort=22,protocol=tcp,cidrs=$ip/32"
      - name: BE 배포
        run: scripts/deploy-backend.sh
      - name: 헬스 체크
        run: curl -fsS --retry 30 --retry-delay 5 --retry-all-errors "$API_URL/actuator/health"
      - name: SSH 다시 닫기
        if: always() && steps.runner.outputs.ip != ''
        run: |
          aws lightsail close-instance-public-ports --instance-name "$LIGHTSAIL_INSTANCE" \
            --port-info "fromPort=22,toPort=22,protocol=tcp,cidrs=${{ steps.runner.outputs.ip }}/32"

  # FE 빌드가 BE에서 장면 목록을 받아 오므로 BE 배포가 끝난 뒤에 한다
  deploy-frontend:
    needs: deploy-backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Vercel 운영 배포
        run: npx --yes vercel@65.2.0 deploy --prod --yes --token "$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
